<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>makza.fun</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  /* ---------- BACKGROUND ---------- */
  .bg {
    position: fixed;
    inset: 0;
    background-image: url('makza.jpg');
    background-repeat: no-repeat;
    background-position: center center;
    background-size: contain;   /* wide screen — full photo visible */
    background-color: #000;
    z-index: -2;
  }
  /* portrait / mobile — crop to fill */
  @media (max-aspect-ratio: 1/1) {
    .bg { background-size: cover; }
  }

  .overlay {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.65) 100%);
    z-index: -1;
  }

  /* ---------- BOTTOM PANEL ---------- */
  .wrap {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
  }

  form {
    width: 100%;
    max-width: 460px;
    display: flex;
    gap: 8px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    padding: 6px 6px 6px 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    transition: border-color .2s;
  }
  form[aria-invalid="true"],
  input[aria-invalid="true"] { border-color: rgba(255,80,80,0.85) !important; }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 16px;
    padding: 12px 0;
    letter-spacing: 0.5px;
  }
  input::placeholder { color: rgba(255,255,255,0.65); }

  button {
    border: none;
    background: #fff;
    color: #111;
    font-weight: 600;
    font-size: 15px;
    padding: 12px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
    white-space: nowrap;
  }
  button:active { transform: scale(0.96); opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: default; }

  /* Formspree success / error messages */
  [data-fs-success],
  [data-fs-error] {
    margin-top: 12px;
    color: #fff;
    font-size: 14px;
    text-align: center;
    min-height: 20px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  [data-fs-error]:empty,
  [data-fs-success]:empty { min-height: 0; margin-top: 0; }
  [data-fs-error] { color: #ffb4b4; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="wrap">
    <form id="my-form" novalidate>
      <input
        type="text"
        id="message"
        name="message"
        placeholder="Leave a message…"
        maxlength="30"
        inputmode="text"
        autocomplete="off"
        required
        data-fs-field
      >
      <button type="submit" data-fs-submit-btn>Send</button>
    </form>

    <!-- Formspree output -->
    <div data-fs-success></div>
    <div data-fs-error></div>
  </div>

<script>
  // Allow only latin letters, digits, @ and space. Max 30 chars.
  const input = document.getElementById('message');
  input.addEventListener('input', () => {
    input.value = input.value.replace(/[^A-Za-z0-9@ ]/g, '').slice(0, 30);
  });

  // Formspree AJAX SDK
  window.formspree = window.formspree || function () {
    (formspree.q = formspree.q || []).push(arguments);
  };
  formspree('initForm', { formElement: '#my-form', formId: 'mvkonjkp' });
</script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>
</body>
</html>
